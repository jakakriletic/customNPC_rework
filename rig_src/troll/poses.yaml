  leg_r.out: 4
  leg_l.out: 4
  leg_r.raise: 8
  leg_l.raise: 8
  knee_r.bend: 14
  knee_l.bend: 14
  torso.bend: 14
  head.nod: -14
  arm_r.raise: 12
  arm_r.out: 12
  elbow_r.bend: 22
  wrist_r.bend: -62
  arm_l.raise: 8
  arm_l.out: 12
  elbow_l.bend: 28

