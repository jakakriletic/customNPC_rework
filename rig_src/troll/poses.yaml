# Knjižnica poz za trolla.  Vrednosti so kontrolniki iz rig.yaml (stopinje,
# glede na NJEGOVO levo/desno).  `base:` podeduje drugo pozo, `opis:` je komentar.
# Surove kosti: "kost.kanal.os: vrednost", npr. "club.rotation.x: 10".
# Vsako novo pozo preveri:  py -3 tools/anim/preview.py poses troll <ime>

neutral: {}

