# 4. Ground pound: zarjove, dvigne kij z obema rokama in ga zabije v tla.
#    Najmočnejši napad: velik krog škode, močan potres zaslona.
name: pound
length: 2.6
beats:
  - {t: 0.00, pose: stand}
  - {t: 0.80, pose: pound_windup, ease: out, hold: 0.35}
  - {t: 1.30, pose: pound_hit, ease: strike, hold: 0.45}
  - {t: 2.60, pose: stand, ease: smooth}
events:
  - {t: 0.35, type: sound, sound: [troll.roar, troll.roar_rumble]}
  - {t: 0.90, type: lock}
  - {t: 1.12, type: sound, sound: troll.swing}
  - {t: 1.30, type: hit, id: pound, shape: circle, forward: 5.0, side: 1.2, radius: 4.5, falloff: 0.5,
     damage: 1.25, knockback: 1.6, lift: 0.5}
  - {t: 1.30, type: sound, sound: [troll.ground_pound, troll.wood_crack]}
  - {t: 1.30, type: shake, strength: 2.0, radius: 32, duration: 1.2}
  - {t: 1.30, type: dust, forward: 5.0, side: 1.2, radius: 4.5, count: 90}
