buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'idea'
version = '0.0.0-baseline'
group = 'local.customnpcs'
archivesBaseName = 'customnpcs-patch-classes'
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    version = '1.12.2-14.23.5.2847'
    mappings = 'snapshot_20171003'
    runDir = 'run'
    makeObfSourceJar = false
}
repositories {
    flatDir { dirs 'libs' }
    mavenCentral()
}
dependencies {
    // Generated from the SHA-256-verified original by ForgeGradle's SRG -> MCP remapper.
    compile files('libs/customnpcs-mapped-01Oct19.jar')
    testCompile files('libs/junit-4.13.2.jar', 'libs/hamcrest-core-1.3.jar')
}
// Only explicitly restored classes compile; MDK examples are excluded.
sourceSets.main.java.srcDirs = ['src/patch/java']
sourceSets.main.resources.srcDirs = ['src/patch/resources']
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
test {
    // Plain JUnit has no FML class transformer: use mapped compile dependencies.
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath
    testLogging { events 'passed', 'skipped', 'failed' }
}
// FG 2.3 hard-codes an obsolete HTTP assets URL. prepare-assets.ps1 performs
// verified HTTPS downloads instead, before client runs.
afterEvaluate { tasks.getByName('getAssets').enabled = false }

// FML must discover exactly one mod, with restored MCP classes replacing the
// original mapped classes. Never launch the already reobfuscated patch-only JAR.
task devRuntimeMod(type: Jar, dependsOn: classes) {
    archiveName = 'customnpcs-dev-runtime.jar'
    manifest { attributes 'FMLAT': 'cnpcs_at.cfg' }
    from(zipTree('libs/customnpcs-mapped-01Oct19.jar')) {
        exclude 'META-INF/MANIFEST.MF'
        exclude { details ->
            sourceSets.main.output.classesDirs.files.any { new File(it, details.path).isFile() }
        }
    }
    from(sourceSets.main.output)
}
afterEvaluate {
    ['runClient', 'runServer'].each { taskName ->
        tasks.getByName(taskName).dependsOn devRuntimeMod
        tasks.getByName(taskName).maxHeapSize = '2G'
        tasks.getByName(taskName).doFirst {
            classpath = files(classpath.files.findAll {
                !it.name.toLowerCase().startsWith('customnpcs')
            }) + files(devRuntimeMod.archivePath)
        }
    }
}
// Dev server mora brati ukaze s standardnega vhoda. Gradlov JavaExec privzeto
// poda prazen vhod, zato je konzola dev serverja brez tega mrtva in ga ni mogoce
// niti cisto ustaviti z 'stop'. Deluje samo z --no-daemon, ker mora biti System.in
// resnicni vhod procesa. Potrebno za M0.5 in za vsak skriptiran server scenarij.
afterEvaluate { tasks.getByName('runServer').standardInput = System.in }

// runServer in runClient nikoli nista "up to date". ForgeGradle jima prijavi
// dev/run kot izhod, zato je Gradle 15. 9. med skriptiranim scenarijem M0.6 drugi
// zagon preskocil ('Task :runServer UP-TO-DATE') - med zagonoma se v dev/run ni
// nic spremenilo. Server se ni zagnal, skripta pa je cakala na marker do timeouta.
// Zagon serverja je akcija, ne gradnja izhoda; caching tu nima smisla.
afterEvaluate {
    ['runClient', 'runServer'].each { taskName ->
        tasks.getByName(taskName).outputs.upToDateWhen { false }
    }
}

task workspacePaths {
    doLast {
        file("$buildDir/workspace-classpath.txt").text = sourceSets.main.compileClasspath.asPath
        println "Classpath written to $buildDir/workspace-classpath.txt"
    }
}

task testOriginal(type: Test) {
    description = 'Runs characterization tests against the original remapped binary, without patch classes.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = (sourceSets.test.output + sourceSets.test.compileClasspath) - sourceSets.main.output
    // Tests for brand-new rework classes cannot be loaded against the untouched binary.
    exclude '**/SafeFileWriterTest.class'
    exclude '**/CompressedNbtFileTest.class'
    exclude '**/WorldSaveSessionTest.class'
    exclude '**/SafeFileWriterFaultInjectionTest.class'
    exclude '**/DiagTest.class'
    exclude '**/DistributionTest.class'
    exclude '**/DiagSnapshotTest.class'
    testLogging { events 'passed', 'skipped', 'failed' }
}

// Reobfuscate ONLY restored classes. Preserve every other original ZIP entry byte-for-byte.
task buildPatchedMod(dependsOn: ['reobfJar', 'test', 'testOriginal']) {
    doLast {
        def original = file('baseline/customnpcs-original-01Oct19.jar')
        def expected = 'cafacade45fb2aa6ac52956487889d0f4a9d4f6a1682ea28a1f7aca1ba100fa1'
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(original.bytes).encodeHex().toString()
        if (hash != expected) throw new GradleException('Original JAR hash mismatch; refusing to package.')
        def patches = new java.util.zip.ZipFile(jar.archivePath)
        def input = new java.util.zip.ZipFile(original)
        def outputFile = file("$buildDir/libs/CustomNPCs_1.12.2-01Oct19-workspace.jar")
        def output = new java.util.zip.ZipOutputStream(new FileOutputStream(outputFile))
        try {
            def replacements = patches.entries().findAll { !it.directory && it.name.endsWith('.class') }
            def names = replacements.collect { it.name } as Set
            input.entries().each { entry ->
                if (!names.contains(entry.name)) {
                    output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    if (!entry.directory) input.getInputStream(entry).withCloseable { output << it }
                    output.closeEntry()
                }
            }
            replacements.each { entry ->
                output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                patches.getInputStream(entry).withCloseable { output << it }
                output.closeEntry()
            }
            println "Packaged ${names.size()} restored class files into $outputFile"
        } finally { output.close(); input.close(); patches.close() }
    }
}

// --- M0.2r: ponovna izdelava dev/libs/customnpcs-mapped-01Oct19.jar ---------
// Aktivno samo z -PremapOriginal, zato normalen build ostane nespremenjen.
//
// Zakaj obstaja: dev/libs/ je v .gitignore, izvorno okolje je bilo na drugem
// racunalniku, zato je na novi delovni postaji mapiran jar treba regenerirati iz
// SHA-256-preverjenega originala. Uporablja isto ForgeGradle deobf pot kot
// prvotna postavitev, da je rezultat cim bolj verjetno bitno enak zapisu v
// environment-lock.json.
//
// ForgeGradle 2.3 sprejme za deobfCompile samo ExternalModuleDependency;
// 'deobfCompile files(...)' zavrne z "Only allowed to use maven dependencies for
// this." Zato se original prekopira v flatDir repozitorij pod imenom
// <ime>-<verzija>.jar in navede kot modulna odvisnost. Original v baseline/
// ostane nedotaknjen.
if (project.hasProperty('remapOriginal')) {
    def originalJar    = file('baseline/customnpcs-original-01Oct19.jar')
    def remapStageRoot = file("$buildDir/remap-stage")
    def stageGroupDir  = new File(remapStageRoot, 'local.customnpcs')
    def stagedOriginal = new File(stageGroupDir, 'customnpcs-original-01Oct19-01Oct19.jar')
    stageGroupDir.mkdirs()
    if (!stagedOriginal.isFile() || stagedOriginal.length() != originalJar.length()) {
        stagedOriginal.bytes = originalJar.bytes
    }

    // Ivy repozitorij s [organisation] v vzorcu, ne flatDir. flatDir ignorira
    // group in bi zato odgovoril tudi na ForgeGradlovo lastno poizvedbo
    // 'deobf.<group>:<ime>:<verzija>' -- vrnil bi nazaj neprevedeni original
    // namesto deobf rezultata in remap se sploh ne bi zgodil.
    repositories {
        ivy {
            url remapStageRoot.toURI()
            // Gradle 4.9 se nima patternLayout(); layout('pattern') je ekvivalent.
            layout('pattern') { artifact '[organisation]/[module]-[revision].[ext]' }
        }
    }
    dependencies { deobfCompile 'local.customnpcs:customnpcs-original-01Oct19:01Oct19' }

    // deobfCompileDummyTask je tisti, od katerega so odvisni vsi TaskSingleDeobfBin;
    // brez te odvisnosti se remap nikoli ne izvede.
    task exportMappedOriginal(dependsOn: 'deobfCompileDummyTask') {
        description = 'Izvozi ForgeGradle deobf rezultat v dev/libs/customnpcs-mapped-01Oct19.jar'
        doLast {
            def sha = { File f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString().toUpperCase() }

            if (sha(originalJar) != 'CAFACADE45FB2AA6AC52956487889D0F4A9D4F6A1682EA28A1F7ACA1BA100FA1') {
                throw new GradleException('Original JAR hash mismatch; refusing to export.')
            }

            // Deobf se pri ForgeGradle 2.3 zgodi sele ob resolvanju konfiguracije,
            // ne ob konfiguraciji projekta. Zato se rezultat vzame neposredno iz
            // resolvanega compile classpatha, ne z iskanjem po disku. Staging kopija
            // originala se izloci, ker vsebuje isti marker v SRG imenih.
            def marker = 'noppes/npcs/util/NBTJsonUtil.class'
            def resolved = configurations.compile.files
            def candidates = resolved.findAll { f ->
                if (!f.isFile() || !f.name.endsWith('.jar')) return false
                if (f.absolutePath.replace('\\', '/').contains('/remap-stage/')) return false
                try {
                    return new java.util.zip.ZipFile(f).withCloseable { z -> z.getEntry(marker) != null }
                } catch (ignored) { return false }
            }
            if (candidates.isEmpty()) {
                throw new GradleException("Deobf rezultata ni najti v compile classpathu. Resolvano:\n  " + resolved*.absolutePath.join('\n  '))
            }
            def source = candidates.max { it.lastModified() }
            println "vir: ${source.absolutePath}"

            def out = file('libs/customnpcs-mapped-01Oct19.jar')
            out.parentFile.mkdirs()
            out.bytes = source.bytes

            def got  = sha(out)
            def want = '9C2AD37C6F64AE7B7801378E32A9CCDE70600E1F2E7F082C4E9394C38FDC8CC3'
            println "dobljeni SHA-256 = ${got}"
            println "lock     SHA-256 = ${want}"
            println got == want ? 'UJEMA SE z environment-lock.json' : 'NE UJEMA SE -> jar je lahko vseeno pravilen; odlocijo testi (testOriginal + test), nato odlocitev D-0NN in posodobitev locka'
        }
    }
}
