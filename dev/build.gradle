buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'idea'
version = '0.0.0-baseline'
group = 'local.customnpcs'
archivesBaseName = 'customnpcs-patch-classes'
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    version = '1.12.2-14.23.5.2847'
    mappings = 'snapshot_20171003'
    runDir = 'run'
    makeObfSourceJar = false
}
repositories {
    flatDir { dirs 'libs' }
    mavenCentral()
}
dependencies {
    // Generated from the SHA-256-verified original by ForgeGradle's SRG -> MCP remapper.
    compile files('libs/customnpcs-mapped-01Oct19.jar')
    testCompile files('libs/junit-4.13.2.jar', 'libs/hamcrest-core-1.3.jar')
}
// Only explicitly restored classes compile; MDK examples are excluded.
sourceSets.main.java.srcDirs = ['src/patch/java']
sourceSets.main.resources.srcDirs = ['src/patch/resources']
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
test {
    // Plain JUnit has no FML class transformer: use mapped compile dependencies.
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath
    testLogging { events 'passed', 'skipped', 'failed' }
}
// FG 2.3 hard-codes an obsolete HTTP assets URL. prepare-assets.ps1 performs
// verified HTTPS downloads instead, before client runs.
afterEvaluate { tasks.getByName('getAssets').enabled = false }

// FML must discover exactly one mod, with restored MCP classes replacing the
// original mapped classes. Never launch the already reobfuscated patch-only JAR.
task devRuntimeMod(type: Jar, dependsOn: classes) {
    archiveName = 'customnpcs-dev-runtime.jar'
    manifest { attributes 'FMLAT': 'cnpcs_at.cfg' }
    from(zipTree('libs/customnpcs-mapped-01Oct19.jar')) {
        exclude 'META-INF/MANIFEST.MF'
        exclude { details ->
            sourceSets.main.output.classesDirs.files.any { new File(it, details.path).isFile() }
        }
    }
    from(sourceSets.main.output)
}
afterEvaluate {
    ['runClient', 'runServer'].each { taskName ->
        tasks.getByName(taskName).dependsOn devRuntimeMod
        tasks.getByName(taskName).maxHeapSize = '2G'
        tasks.getByName(taskName).doFirst {
            classpath = files(classpath.files.findAll {
                !it.name.toLowerCase().startsWith('customnpcs')
            }) + files(devRuntimeMod.archivePath)
        }
    }
}
task workspacePaths {
    doLast {
        file("$buildDir/workspace-classpath.txt").text = sourceSets.main.compileClasspath.asPath
        println "Classpath written to $buildDir/workspace-classpath.txt"
    }
}

task testOriginal(type: Test) {
    description = 'Runs characterization tests against the original remapped binary, without patch classes.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = (sourceSets.test.output + sourceSets.test.compileClasspath) - sourceSets.main.output
    // Tests for brand-new rework classes cannot be loaded against the untouched binary.
    exclude '**/SafeFileWriterTest.class'
    testLogging { events 'passed', 'skipped', 'failed' }
}

// Reobfuscate ONLY restored classes. Preserve every other original ZIP entry byte-for-byte.
task buildPatchedMod(dependsOn: ['reobfJar', 'test', 'testOriginal']) {
    doLast {
        def original = file('baseline/customnpcs-original-01Oct19.jar')
        def expected = 'cafacade45fb2aa6ac52956487889d0f4a9d4f6a1682ea28a1f7aca1ba100fa1'
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(original.bytes).encodeHex().toString()
        if (hash != expected) throw new GradleException('Original JAR hash mismatch; refusing to package.')
        def patches = new java.util.zip.ZipFile(jar.archivePath)
        def input = new java.util.zip.ZipFile(original)
        def outputFile = file("$buildDir/libs/CustomNPCs_1.12.2-01Oct19-workspace.jar")
        def output = new java.util.zip.ZipOutputStream(new FileOutputStream(outputFile))
        try {
            def replacements = patches.entries().findAll { !it.directory && it.name.endsWith('.class') }
            def names = replacements.collect { it.name } as Set
            input.entries().each { entry ->
                if (!names.contains(entry.name)) {
                    output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    if (!entry.directory) input.getInputStream(entry).withCloseable { output << it }
                    output.closeEntry()
                }
            }
            replacements.each { entry ->
                output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                patches.getInputStream(entry).withCloseable { output << it }
                output.closeEntry()
            }
            println "Packaged ${names.size()} restored class files into $outputFile"
        } finally { output.close(); input.close(); patches.close() }
    }
}
